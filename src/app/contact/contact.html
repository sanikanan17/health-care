
    <div class="contact-page">

  <div class="contact-container">

    
    <div class="contact-info">

      <h2>Get In Touch</h2>

      <p>
        Have a question or need assistance?
        Contact our hospital team and we will be happy to help.
      </p>

      <div class="info-item">
        <span>📍</span>
        <div>
          <h4>Address</h4>
          <p>123 Healthcare Street, City</p>
        </div>
      </div>

      <div class="info-item">
        <span>📞</span>
        <div>
          <h4>Phone</h4>
          <p>+91 98765 43210</p>
        </div>
      </div>

      <div class="info-item">
        <span>✉️</span>
        <div>
          <h4>Email</h4>
          <p>hospital@example.com</p>
        </div>
      </div>

      <div class="info-item">
        <span>🕐</span>
        <div>
          <h4>Working Hours</h4>
          <p>Monday - Sunday: 24 Hours</p>
        </div>
      </div>

    </div>



    <div class="contact-form">

      <h1>Contact Us</h1>

      <p class="form-subtitle">
        Please fill in the form below
      </p>

      <form>


        <div class="row">

          <div class="form-group">
            <label for="firstname">First Name</label>

            <input
              type="text"
              id="firstname"
              name="firstname"
              placeholder="Enter first name"
              pattern="[A-Za-z]+"
              required>
          </div>

          <div class="form-group">
            <label for="lastname">Last Name</label>

            <input
              type="text"
              id="lastname"
              name="lastname"
              placeholder="Enter last name"
              required>
          </div>

        </div>


        <div class="row">

          <div class="form-group">
            <label for="email">Email Address</label>

            <input
              type="email"
              id="email"
              name="user_email"
              placeholder="name@example.com"
              required>
          </div>

          <div class="form-group">
            <label for="number">Contact Number</label>

            <input
              type="tel"
              id="number"
              name="contact_no"
              placeholder="Enter 10 digit number"
              pattern="[0-9]{10}"
              required>
          </div>

        </div>
        <div class="form-group">

          <label>Gender</label>

          <div class="gender-options">

            <label>
              <input type="radio" name="gender" value="male" required>
              Male
            </label>

            <label>
              <input type="radio" name="gender" value="female">
              Female
            </label>

            <label>
              <input type="radio" name="gender" value="others">
              Others
            </label>

          </div>

        </div>

        <div class="form-group">

          <label for="dob">
            Date of Birth
          </label>

          <input
            type="date"
            id="dob"
            name="dob"
            required>

        </div>

        <div class="form-group">

          <label for="subject">
            Subject
          </label>

          <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Enter subject"
            required>

        </div>

        <div class="form-group">

          <label for="address">
            Message / Address
          </label>

          <textarea
            id="address"
            name="address"
            rows="4"
            placeholder="Enter your message..."
            required></textarea>

        </div>


        
        <div class="button-group">

          <button type="submit" class="submit-btn">
            Send Message
          </button>

          <button type="reset" class="cancel-btn">
            Clear
          </button>

        </div>

      </form>

    </div>

  </div>

</div>
